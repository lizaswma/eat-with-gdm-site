<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eat with GDM</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --accent: #a5457a;
    --card-bg: #f7f2f5;
    --card-border: #e6d9e1;
    --rule: #e2e2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16141a;
      --fg: #eee7ea;
      --muted: #b3a9ae;
      --accent: #e2a0c4;
      --card-bg: #221e26;
      --card-border: #3a2f38;
      --rule: #322c33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 0; margin-bottom: 2rem; }
  h2 { font-size: 1.15rem; margin-top: 2.5rem; border-top: 1px solid var(--rule); padding-top: 1.75rem; }
  h2:first-of-type { border-top: none; padding-top: 0; }
  p { margin: 0.9rem 0; }
  ul { margin: 0.9rem 0; padding-left: 1.3rem; }
  li { margin: 0.4rem 0; }
  a { color: var(--accent); }
  .summary {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0 2.5rem;
  }
  .summary h2 { margin-top: 0; border-top: none; padding-top: 0; font-size: 1.05rem; }
  .summary ul { margin-bottom: 0; }
  code {
    background: var(--card-bg);
    border-radius: 4px;
    padding: 0.1em 0.35em;
    font-size: 0.9em;
  }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Eat with GDM</h1>
  <p class="subtitle">A simple meal, glucose and walk log for gestational diabetes.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="terms.html">Terms of Service</a></li>
    <li><a href="support.html">Support</a></li>
  </ul>
</main>
</body>
</html>
